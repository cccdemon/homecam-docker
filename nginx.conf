user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Upstream MediaMTX API
    upstream mediamtx_api {
        server mediamtx:8888;
    }

    # Upstream MediaMTX WebRTC
    upstream mediamtx_webrtc {
        server mediamtx:8555;
    }

    # Upstream MediaMTX HLS
    upstream mediamtx_hls {
        server mediamtx:8889;
    }

    # Main web UI server
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html index.htm;

        # App shell and streaming client should update immediately after deploys.
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location = /stream.js {
            add_header Cache-Control "no-store";
        }

        # Main page
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # Static assets (CSS, JS, images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy MediaMTX API calls
        location ~ ^/v3/ {
            proxy_pass http://mediamtx_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host mediamtx;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        # Proxy WebRTC connection
        location ~ ^/webcam(/|$) {
            proxy_pass http://mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        # Proxy HLS streams
        location ~ ^/hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://mediamtx_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 404 error page
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # 50x error page
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
