# MediaMTX Configuration
# Reference: https://github.com/bluenviron/mediamtx

# Global settings
logLevel: info
logDestinations:
  - stdout
  - file
logFile: /var/log/mediamtx/streaming.log

# Authentication (optional)
# authentication:
#   users:
#     - user: admin
#       pass: changeme123

# API
api: true
apiAddress: :8888
apiEncryption: false

# Metrics (optional)
metrics: true
metricsAddress: :9998

# RTMP server (for ingest/push)
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"

# RTSP server
rtsp: true
rtspAddress: :8322
rtspEncryption: "no"

# HLS server (HTTP Live Streaming fallback)
hls: true
hlsAddress: :8889
hlsEncryption: false
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 2s
hlsPartDuration: 500ms

# WebRTC (low-latency peer-to-peer)
webrtc: true
webrtcAddress: :8555
webrtcEncryption: false
webrtcLocalUDPAddress: :8555
webrtcLocalTCPAddress: ""
webrtcAdditionalHosts:
  - stream.raumdock.org

# Performance tuning
readTimeout: 10s
writeQueueSize: 256
writeTimeout: 10s
udpMaxPayloadSize: 1472

# Stream paths configuration
paths:
  # Primary USB camera stream via V4L2
  webcam:
    # Publish the USB camera into this path when MediaMTX starts.
    # Browser WebRTC requires H.264/VP8/VP9, so MJPEG input is transcoded.
    runOnInit: ffmpeg -hide_banner -loglevel error -f v4l2 -input_format mjpeg -video_size 1920x1080 -framerate 30 -i /dev/video0 -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -tune zerolatency -profile:v high -crf 17 -maxrate 25M -bufsize 25M -g 30 -bf 0 -f rtsp -rtsp_transport tcp rtsp://localhost:8322/webcam
    runOnInitRestart: true
    maxReaders: 10

# Additional paths can be added here for multiple cameras
# Example for a second camera:
#   webcam2:
#     runOnInit: ffmpeg -hide_banner -loglevel error -f v4l2 -input_format mjpeg -video_size 1920x1080 -framerate 30 -i /dev/video1 -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -tune zerolatency -profile:v high -crf 17 -maxrate 25M -bufsize 25M -g 30 -bf 0 -f rtsp -rtsp_transport tcp rtsp://localhost:8322/webcam2
#     runOnInitRestart: true
