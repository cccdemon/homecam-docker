services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1-ffmpeg}
    container_name: mediamtx-webcam
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      # WebRTC (low-latency peer-to-peer)
      - "${WEBRTC_PORT:-8555}:8555/tcp"
      - "${WEBRTC_PORT:-8555}:8555/udp"
      # HTTP API & Dashboard
      - "${HTTP_PORT:-8888}:8888/tcp"
      # RTSP (internal streaming protocol)
      - "${RTSP_PORT:-8322}:8322/tcp"
      # RTMP (ingest point)
      - "${RTMP_PORT:-1935}:1935/tcp"
      # HLS (fallback streaming)
      - "${HLS_PORT:-8889}:8889/tcp"
    volumes:
      # Mount mediamtx configuration
      - ./mediamtx.yml:/mediamtx.yml:ro
      # USB camera device pass-through
      - /dev/video0:/dev/video0:rw
      # Optional: Recordings directory
      - ./recordings:/recordings
      # Optional: Logs
      - ./logs:/var/log/mediamtx
    devices:
      # Pass through USB device
      - /dev/video0
    cap_add:
      # Allow raw socket access for certain operations
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '${CPUS_LIMIT:-2}'
          memory: ${MEMORY_LIMIT:-512m}
        reservations:
          cpus: '1'
          memory: 256m
    networks:
      - streaming
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v3/config/global/get"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-ui:
    image: nginx:alpine
    container_name: webcam-webui
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mediamtx
    networks:
      - streaming
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  streaming:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  recordings:
    driver: local
  logs:
    driver: local
